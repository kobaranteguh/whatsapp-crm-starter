<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WhatsApp CRM</title>
<style>
  :root { --bg:#f5f6f8; --panel:#fff; --line:#e5e7eb; --ink:#111827; --mute:#6b7280; --brand:#16a34a; --out:#dcfce7; --in:#fff; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; color:var(--ink); background:var(--bg); height:100vh; display:flex; flex-direction:column; }
  header { display:flex; gap:8px; align-items:center; padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0 12px 0 0; }
  select, input, textarea, button { font:inherit; }
  button { border:1px solid var(--line); background:#fff; border-radius:8px; padding:7px 12px; cursor:pointer; }
  button.primary { background:var(--brand); border-color:var(--brand); color:#fff; font-weight:600; }
  main { flex:1; display:grid; grid-template-columns:320px 1fr; min-height:0; }
  #contacts { background:var(--panel); border-right:1px solid var(--line); overflow:auto; }
  .contact { padding:12px 14px; border-bottom:1px solid var(--line); cursor:pointer; }
  .contact.active, .contact:hover { background:#f0fdf4; }
  .contact .n { font-weight:600; display:flex; justify-content:space-between; gap:8px; }
  .contact .t { color:var(--mute); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .badge { background:var(--brand); color:#fff; border-radius:999px; font-size:11px; padding:0 7px; }
  #chat { display:flex; flex-direction:column; min-height:0; }
  #thread { flex:1; overflow:auto; padding:16px; display:flex; flex-direction:column; gap:6px; }
  .msg { align-self:flex-start; max-width:70%; padding:7px 10px; border-radius:10px; background:var(--in); border:1px solid var(--line); white-space:pre-wrap; word-wrap:break-word; }
  .msg.out { align-self:flex-end; background:var(--out); border-color:#bbf7d0; }
  .msg .meta { font-size:11px; color:var(--mute); margin-top:2px; text-align:right; }
  .msg .err { color:#b91c1c; font-size:12px; }
  #composer { display:flex; gap:8px; padding:10px; background:var(--panel); border-top:1px solid var(--line); }
  #composer textarea { flex:1; resize:none; border:1px solid var(--line); border-radius:8px; padding:8px; height:42px; }
  .note { padding:8px 12px; background:#fffbeb; border-top:1px solid #fde68a; color:#92400e; font-size:13px; }
  .empty { margin:auto; color:var(--mute); text-align:center; max-width:420px; padding:24px; }
  @media (max-width:760px) { main { grid-template-columns:1fr; } #contacts { max-height:40vh; } }
</style>
</head>
<body>
<header>
  <h1>WhatsApp CRM</h1>
  <select id="numberSel" title="Your connected WhatsApp numbers"></select>
  <button id="refreshBtn">Refresh numbers</button>
  <button id="newBtn">New chat</button>
  <span style="flex:1"></span>
  <button id="connectBtn" class="primary">+ Connect WhatsApp</button>
</header>
<main>
  <aside id="contacts"></aside>
  <section id="chat">
    <div id="thread"><div class="empty">
      <p>Save this app's webhook URL in the WasapFlow portal (Integration), then click <b>+ Connect WhatsApp</b> above and message the number from your phone. It shows up here.</p>
    </div></div>
    <div id="windowNote" class="note" hidden>More than 24 hours since this customer last wrote. WhatsApp only allows an approved template now.</div>
    <form id="composer" hidden>
      <textarea id="text" placeholder="Type a message"></textarea>
      <button class="primary" id="sendBtn">Send</button>
      <button type="button" id="tplBtn" title="Send an approved template">Template…</button>
    </form>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
let current = null;

async function api(path, opts = {}) {
  const r = await fetch(path, { headers: { 'content-type': 'application/json' }, ...opts, body: opts.body ? JSON.stringify(opts.body) : undefined });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error?.message || r.statusText);
  return d;
}
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const time = (ts) => new Date(ts * 1000).toLocaleString([], { dateStyle: 'short', timeStyle: 'short' });

async function loadNumbers() {
  const nums = await api('/api/numbers');
  $('numberSel').innerHTML = nums.length
    ? nums.map(n => `<option value="${esc(n.phone_number_id)}">${esc(n.display_name || n.phone_number || n.phone_number_id)}${n.status && n.status !== 'active' ? ' (' + esc(n.status) + ')' : ''}</option>`).join('')
    : '<option value="">No number connected</option>';
}

async function loadContacts() {
  const list = await api('/api/contacts');
  $('contacts').innerHTML = list.map(c => `
    <div class="contact ${current?.key === c.key ? 'active' : ''}" data-key="${esc(c.key)}">
      <div class="n"><span>${esc(c.name || c.phone || c.bsuid)}</span>${c.unread ? `<span class="badge">${c.unread}</span>` : ''}</div>
      <div class="t">${esc(c.last_text || '')}</div>
    </div>`).join('') || '<div class="empty">No conversations yet.</div>';
  if (current) current = list.find(c => c.key === current.key) || current;
}

async function openChat(key) {
  const list = await api('/api/contacts');
  current = list.find(c => c.key === key);
  const msgs = await api(`/api/contacts/${encodeURIComponent(key)}/messages`);
  $('thread').innerHTML = msgs.map(m =>
    `<div class="msg ${m.direction === 'out' ? 'out' : ''}">` +
    (m.text != null ? esc(m.text) : `<i>[${esc(m.type)}]</i>`) +
    (m.error ? `<div class="err">${esc(m.error)}</div>` : '') +
    `<div class="meta">${m.source === 'business_app' ? 'phone · ' : ''}${m.history ? 'history · ' : ''}${time(m.ts)}${m.direction === 'out' ? ' · ' + esc(m.status) : ''}</div></div>`
  ).join('');
  $('thread').scrollTop = 1e9;
  $('composer').hidden = false;
  $('windowNote').hidden = !!current?.window_open;
  loadContacts();
}

$('contacts').onclick = (e) => { const el = e.target.closest('.contact'); if (el) openChat(el.dataset.key); };

$('composer').onsubmit = async (e) => {
  e.preventDefault();
  const text = $('text').value.trim();
  if (!text || !current) return;
  try { await api('/api/send', { method: 'POST', body: { contact_key: current.key, text } }); $('text').value = ''; openChat(current.key); }
  catch (err) { alert(err.message); }
};
$('text').onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('composer').requestSubmit(); } };

$('tplBtn').onclick = async () => {
  const name = prompt('Approved template name (e.g. hello_world)');
  if (!name || !current) return;
  const language = prompt('Language code', 'en_US') || 'en_US';
  try { await api('/api/send', { method: 'POST', body: { contact_key: current.key, template: { name, language } } }); openChat(current.key); }
  catch (err) { alert(err.message); }
};

$('newBtn').onclick = async () => {
  const phone_number_id = $('numberSel').value;
  if (!phone_number_id) return alert('Connect a number first.');
  const phone = prompt('Customer WhatsApp number, international format (e.g. 60123456789)');
  if (!phone) return;
  try { const c = await api('/api/contacts', { method: 'POST', body: { phone_number_id, phone } }); await openChat(c.key); }
  catch (err) { alert(err.message); }
};

$('refreshBtn').onclick = async () => { try { await api('/api/numbers/refresh', { method: 'POST' }); await loadNumbers(); } catch (err) { alert(err.message); } };

// Connect WhatsApp: open the popup first (avoids popup blockers), then point it at the short-lived link.
$('connectBtn').onclick = async () => {
  const name = prompt('Business name', 'My business');
  if (name === null) return;
  const win = window.open('about:blank', 'wasapflow_connect', 'width=720,height=820');
  try {
    const { connect_url, state } = await api('/api/connect', { method: 'POST', body: { display_name: name } });
    win.location = connect_url;
    const onMsg = async (e) => {
      if (e.origin !== 'https://officialapi.wasapflow.com' || e.data?.state !== state) return;
      window.removeEventListener('message', onMsg);
      if (e.data.type === 'WASAPFLOW_CONNECT_SUCCESS') { await api('/api/numbers/refresh', { method: 'POST' }); await loadNumbers(); alert('Connected: ' + (e.data.display_name || e.data.phone_number_id)); }
      else if (e.data.type === 'WASAPFLOW_CONNECT_ERROR') alert('Not connected: ' + e.data.message);
    };
    window.addEventListener('message', onMsg);
  } catch (err) { win.close(); alert(err.message); }
};

loadNumbers(); loadContacts();
setInterval(() => { loadContacts(); if (current && document.activeElement !== $('text')) openChat(current.key); }, 5000);
</script>
</body>
</html>
